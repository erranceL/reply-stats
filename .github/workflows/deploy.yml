name: Deploy

# 默认不随 push 自动部署：Lightsail 22 端口有 IP 白名单时，
# GitHub Actions 连不上 SSH。需要自动部署时，先放开 22，再在 Actions 里手动 Run workflow。
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync code to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/reply-stats/"

      - name: Install and restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/reply-stats
          if [[ ! -f .env ]]; then
            echo "缺少 /opt/reply-stats/.env，请先在服务器上手动创建并填写凭证"
            exit 1
          fi
          if [[ -f deploy/reply-stats.nginx.conf ]]; then
            sudo cp deploy/reply-stats.nginx.conf /etc/nginx/sites-available/reply-stats
            sudo nginx -t
            sudo systemctl reload nginx
          fi
          npm ci --omit=dev
          sudo systemctl restart reply-stats
          sleep 2
          sudo systemctl --no-pager --full status reply-stats
          curl -fsS http://127.0.0.1:3100/healthz
          echo
          EOF
